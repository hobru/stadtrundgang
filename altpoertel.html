<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Altpörtel Speyer — Erzählrundgang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --brick:#a83f2e;
    --brick-dark:#7a2c20;
    --lake:#28454d;
    --lake-light:#3f6a72;
    --cream:#f2e8d6;
    --paper:#fbf6ec;
    --ink:#271f18;
    --gold:#c69a3c;
    --line: rgba(39,31,24,0.14);
    --radius: 2px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--lake);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,0.05), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(255,255,255,0.04), transparent 45%);
    color:var(--ink);
    font-family:"Source Serif 4", Georgia, serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .stage{
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px 18px;
  }
  .card{
    background:var(--paper);
    width:100%;
    max-width:640px;
    height:100%;
    max-height:900px;
    border-radius:var(--radius);
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.06);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    min-height:0;
  }
  /* --- Route line (signature element) --- */
  .route{
    padding:16px 24px 16px;
    background:var(--cream);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .route-topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .home-link{
    font-family:"IBM Plex Mono", monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--lake);
    border:1px solid var(--lake);
    padding:5px 10px;
    transition:background .2s, color .2s;
  }
  .home-link:hover{ background:var(--lake); color:var(--paper); }
  .phase-indicator{
    font-family:"IBM Plex Mono", monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--brick-dark);
    font-weight:600;
  }
  .route svg{ display:block; width:100%; height:34px; overflow:visible; }
  .route-track{ stroke:rgba(39,31,24,0.18); stroke-width:2; fill:none; }
  .route-fill{ stroke:var(--brick); stroke-width:2; fill:none; transition:stroke-dashoffset .6s cubic-bezier(.65,0,.35,1); }
  .route-dot{ cursor:pointer; }
  .route-dot circle.base{ fill:var(--paper); stroke:rgba(39,31,24,0.35); stroke-width:1.5; transition:all .3s ease; }
  .route-dot.done circle.base{ fill:var(--brick); stroke:var(--brick); }
  .route-dot.current circle.base{ fill:var(--gold); stroke:var(--gold); r:7; }
  .route-dot.current circle.pulse{ opacity:1; }
  .route-dot circle.pulse{ fill:none; stroke:var(--gold); stroke-width:1.5; opacity:0; transform-origin:center; animation:pulse 2.2s ease-out infinite; }
  @keyframes pulse{ 0%{ r:7; opacity:.7;} 100%{ r:16; opacity:0;} }

  .head{
    padding:20px 28px 0;
    flex-shrink:0;
  }
  .eyebrow{
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--brick-dark);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  h1{
    font-family:"Fraunces", serif;
    font-weight:600;
    font-size:clamp(28px,6vw,40px);
    line-height:1.05;
    margin:8px 0 2px;
    color:var(--ink);
  }
  .subtitle{
    font-family:"Fraunces", serif;
    font-style:italic;
    font-weight:500;
    color:var(--lake);
    font-size:16px;
    margin:0 0 14px;
  }
  .body-scroll{
    flex:1;
    overflow-y:auto;
    padding:6px 28px 24px;
  }
  .body-scroll::-webkit-scrollbar{ width:6px; }
  .body-scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  .facts{ margin:6px 0 0; padding:0; list-style:none; }
  .facts li{
    position:relative;
    padding-left:20px;
    margin-bottom:11px;
    font-size:15.5px;
    line-height:1.55;
  }
  .facts li::before{
    content:"";
    position:absolute; left:0; top:9px;
    width:6px; height:6px;
    background:var(--brick);
  }
  .anekdote{
    margin-top:22px;
    background:linear-gradient(180deg, var(--cream), rgba(242,232,214,0.5));
    border-left:3px solid var(--gold);
    padding:16px 18px 18px;
  }
  .anekdote-label{
    font-family:"IBM Plex Mono", monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    display:block;
    margin-bottom:6px;
  }
  .anekdote h3{
    font-family:"Fraunces", serif;
    font-style:italic;
    font-weight:600;
    font-size:18px;
    margin:0 0 8px;
    color:var(--brick-dark);
  }
  .anekdote p{
    margin:0;
    font-size:15px;
    line-height:1.62;
    color:var(--ink);
  }
  .mapbox{
    margin-top:20px;
    border:1px solid var(--line);
    background:var(--cream);
  }
  .mapbox iframe{
    width:100%;
    height:180px;
    display:block;
    border:0;
    filter:sepia(8%) saturate(85%);
  }
  .maplinks{
    display:flex;
    gap:1px;
    background:var(--line);
  }
  .maplinks a{
    flex:1;
    text-align:center;
    font-family:"IBM Plex Mono", monospace;
    font-size:11.5px;
    letter-spacing:.05em;
    text-decoration:none;
    color:var(--ink);
    background:var(--cream);
    padding:11px 6px;
    transition:background .2s,color .2s;
  }
  .maplinks a:hover{ background:var(--brick); color:var(--paper); }
  .coords{
    font-family:"IBM Plex Mono", monospace;
    font-size:11px;
    color:var(--lake-light);
    padding:8px 10px 0;
  }
  .compass{
    display:flex;
    flex-wrap:wrap;
    gap:8px 18px;
    margin:16px 0 4px;
  }
  .compass div{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    color:var(--lake);
  }
  .compass b{ color:var(--brick-dark); }

  /* --- Nav --- */
  .nav{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    border-top:1px solid var(--line);
    background:var(--paper);
  }
  .nav button{
    font-family:"IBM Plex Mono", monospace;
    font-size:12.5px;
    letter-spacing:.06em;
    background:none;
    border:1px solid var(--ink);
    color:var(--ink);
    padding:10px 16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:background .2s,color .2s;
  }
  .nav button:hover:not(:disabled){ background:var(--ink); color:var(--paper); }
  .nav button:disabled{ opacity:0.25; cursor:default; }
  .nav .counter{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    color:var(--lake-light);
  }

  .slide{
    display:none;
    flex-direction:column;
    flex:1;
    min-height:0;
    animation:fade .35s ease;
  }
  .slide.active{ display:flex; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  @media (max-width:480px){
    .stage{ padding:0; }
    .card{ max-height:none; border-radius:0; }
    .head{ padding:16px 20px 0; }
    .body-scroll{ padding:6px 20px 20px; }
  }

</style>
</head>
<body>

<div class="stage">
  <div class="card">

    <div class="route">
      <div class="route-topbar">
        <a class="home-link" href="index.html">← Alle Rundgänge</a>
        <span class="phase-indicator" id="phaseIndicator"></span>
      </div>
      <svg viewBox="0 0 600 34" id="routeSvg">
        <path class="route-track" d="M20,17 L580,17"/>
        <path class="route-fill" id="routeFill" d="M20,17 L580,17"/>
        <g id="routeDots"></g>
      </svg>
    </div>

    <div id="slides" style="flex:1; min-height:0; display:flex; flex-direction:column;"></div>

    <div class="nav">
      <button id="prevBtn" onclick="go(-1)">‹ Zurück</button>
      <span class="counter" id="counter"></span>
      <button id="nextBtn" onclick="go(1)">Weiter ›</button>
    </div>

  </div>
</div>

<script>
const stations = [
{
  eyebrow: "Im Turm",
  meta: "01 · ca. 9 Min",
  title: "Das westliche Stadttor",
  subtitle: "Auftakt auf der ersten Ausstellungsebene",
  lat: 49.3175593, lng: 8.4323183,
  facts: [
    "Mit 55 Metern gehört das Altpörtel zu den höchsten erhaltenen mittelalterlichen Stadttoren Deutschlands. Es war das westliche Tor Speyers und einer von einst 68 Mauer- und Tortürmen.",
    "Ein Tor stand hier spätestens im späten 12. Jahrhundert. Der untere Teil des heutigen Turms entstand etwa 1230–1250; 1511–1514 kamen sechs Geschosse, Galerie und Dachaufbau hinzu. Nach der Zerstörung Speyers 1689 wurde das Dach neu errichtet.",
    "Vom Tor führt die Maximilianstraße als alte Ost-West-Achse geradewegs zum Dom. Diese Verbindung zwischen städtischem Tor und imperialer Kirche heißt Via Triumphalis.",
    "Das Altpörtel kontrollierte den Zugang zur Stadt, diente der Verteidigung und besaß zwei nur von oben erreichbare Verliese. Hier lagerten auch Werkzeuge des Scharfrichters – die städtische Folterkammer befand sich jedoch im Salzturm, nicht im Altpörtel."
  ],
  compass: [["spätes 12. Jh.","Tor belegt"], ["1230–1250","Unterer Turm"], ["1511–1514","Aufstockung"], ["1689","Zerstörung Speyers"]],
  anekdoteLabel: null, anekdoteTitle:null, anekdoteText:null
},
{
  eyebrow: "1. Ausstellungsebene",
  meta: "02 · ca. 6 Min",
  title: "Eine Stadt hinter Mauern",
  subtitle: "Bürgerpflicht, Landwehr und das Jahr 1689",
  facts: [
    "Speyers Bürger finanzierten und verteidigten die Stadtmauer. Die Zünfte waren jeweils für bestimmte Abschnitte der Befestigung verantwortlich.",
    "Außerhalb der Mauer schützte eine Landwehr aus Gräben, Wällen und Hecken das weitere Stadtgebiet und den Zollbezirk.",
    "1689 verwüsteten französische Truppen Speyer. Auch das Altpörtel war zur Sprengung vorbereitet, blieb aber stehen.",
    "Bei der Restaurierung von 1956 bis 1960 entdeckte man im Mauerwerk noch die alten, mit Pulver gefüllten Sprengkammern."
  ],
  anekdoteLabel: null, anekdoteTitle:null, anekdoteText:null
},
{
  eyebrow: "2. Obergeschoss",
  meta: "03 · ca. 6 Min",
  title: "Die Glocken",
  subtitle: "Öffentliche Zeit vor der Armbanduhr",
  facts: [
    "Bevor persönliche Uhren alltäglich wurden, machten Glocken die Zeit für die ganze Stadt hörbar.",
    "Die große Stundenglocke wurde um 1300 gegossen. Sie ist Speyers älteste Glocke, wiegt etwa 540 Kilogramm und bittet in ihrer lateinischen Inschrift Johannes den Täufer um Schutz.",
    "Die kleinere Viertelstundenglocke entstand 1815 in Frankenthal und wiegt rund 200 Kilogramm.",
    "Das Eichengestell ist eine moderne Rekonstruktion. Vorbild war das stark verwitterte Original, das 2002 aus dem Dachreiter entfernt wurde."
  ],
  anekdoteLabel: null, anekdoteTitle:null, anekdoteText:null
},
{
  eyebrow: "3. Obergeschoss",
  meta: "04 · im Vorbeigehen",
  title: "Der frühere Festsaal",
  subtitle: "Ein kurzer Blick durch das Glas",
  facts: [
    "Hinter dem Glas liegt der ehemalige Festsaal des Turms. Auf diesem Rundgang passieren wir ihn nur kurz und steigen weiter zur Ausstellung über das Reichskammergericht."
  ],
  anekdoteLabel: null, anekdoteTitle:null, anekdoteText:null
},
{
  eyebrow: "5. Obergeschoss",
  meta: "05 · ca. 9 Min",
  title: "Das Reichskammergericht",
  subtitle: "Speyer als Ort höchster Rechtsprechung",
  facts: [
    "Das Heilige Römische Reich hatte keine einzelne Hauptstadt. Seine Institutionen verteilten sich unter anderem auf Wien, Frankfurt, Regensburg und Speyer.",
    "Von 1527 bis 1689 war Speyer der dauerhafte Sitz des Reichskammergerichts, eines der höchsten Gerichte des Reiches. Professionelle Richter und formalisierte schriftliche Verfahren prägten seine Arbeit.",
    "Die Akten von schätzungsweise 100.000 Verfahren erzählen heute nicht nur Rechts-, sondern auch Sozial- und Wirtschaftsgeschichte.",
    "In Goethes \"Götz von Berlichingen\" heißt es \"Macht Euch auf nach Speyer\": Die Parteien sollen zum Gericht reisen – das ist keine frühe Tourismusempfehlung.",
    "Die Redensart \"etwas auf die lange Bank schieben\" wird mit Gerichten und verzögert bearbeiteten Akten verbunden. Die hiesige Ausstellung zeigt dazu allerdings einen Tisch.",
    "Die Zerstörung von 1689 beendete die Speyerer Zeit des Gerichts. Später nahm es seinen Sitz in Wetzlar und bestand dort bis zum Ende des Reiches 1806."
  ],
  anekdoteLabel: null, anekdoteTitle:null, anekdoteText:null
},
{
  eyebrow: "6. Obergeschoss",
  meta: "06 · ca. 10 Min",
  title: "Speyer von oben",
  subtitle: "Stadt, Rhein und Pfalz im Rundblick",
  facts: [
    "Im Osten verbindet die Maximilianstraße das bürgerliche Stadttor mit dem Kaiserdom. Dahinter liegt der Rhein als alter Handelsweg; beim Technik Museum ist eine Boeing zu erkennen. Der Dom ist frei zugänglich.",
    "Im Süden stehen Gedächtniskirche und St.-Josephs-Kirche. Nach Westen reicht der Blick zur Deutschen Weinstraße, zur Villa Ludwigshöhe und zum Hambacher Schloss.",
    "Im Norden liegt Worms mit den UNESCO-Welterbestätten der SchUM-Gemeinden.",
    "Die sichtbare Stadt erklärt ihre Lage: Der Rhein brachte Handel, westliche Straßen verbanden Speyer mit der Pfalz und der Weinstraße, und die Maximilianstraße hielt Tor und Dom auf einer Achse.",
    "Das Altpörtel überstand veränderte Kriegstechnik, die Zerstörung von 1689 und den Druck der Moderne. Es ist heute weder Wehrtor noch Gefängnis, Messstelle oder öffentliche Uhr – aber weiterhin ein Schlüssel zum Verständnis Speyers."
  ],
  anekdoteLabel: null, anekdoteTitle:null, anekdoteText:null
},
{
  eyebrow: "Außen",
  meta: "07 · Abschluss · ca. 5 Min",
  title: "Zeit und Maß",
  subtitle: "Uhren und Speyerer Werkschuh",
  facts: [
    "Nach dem Abstieg endet der Rundgang wieder vor dem Tor. Die beiden Zifferblätter trennen Stunden und Viertelstunden: Das Stundenzifferblatt ist größer, weil die volle Stunde wichtiger war.",
    "Auf der Außenseite ist auch die gesamte Uhr größer. So konnten ankommende Reisende die Zeit schon aus der Entfernung erkennen.",
    "In der Durchfahrt sitzt der Speyerer Werkschuh als eiserner öffentlicher Maßstab. Vor der Einführung des metrischen Systems entsprach dieses lokale Maß ungefähr 28 Zentimetern.",
    "Händler konnten ihre Messstäbe daran prüfen. So verband das Stadttor die Autorität der Stadt mit Vertrauen auf dem Markt."
  ],
  anekdoteLabel:"Schlussgedanke", anekdoteTitle:"Zurück durch Speyers Geschichte",
  anekdoteText:"Der beste Blick vom Altpörtel führt nicht nur über Speyer, sondern zurück durch Speyers Geschichte."
}
];

let current = 0;
const slidesEl = document.getElementById('slides');
const routeDots = document.getElementById('routeDots');
const routeFill = document.getElementById('routeFill');
const totalLen = 560;

stations.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide' + (i===0 ? ' active' : '');
  el.id = 'slide-' + i;
  el.innerHTML = `
    <div class="head">
      <div class="eyebrow"><span>${s.eyebrow}</span><span>${s.meta}</span></div>
      <h1>${s.title}</h1>
      <div class="subtitle">${s.subtitle}</div>
    </div>
    <div class="body-scroll">
      <ul class="facts">${s.facts.map(f=>`<li>${f}</li>`).join('')}</ul>
      ${s.compass ? `<div class="compass">${s.compass.map(c=>`<div><b>${c[0]}</b> ${c[1]}</div>`).join('')}</div>` : ''}
      ${s.lat ? `
      <div class="mapbox">
        <div class="coords">${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}</div>
        <iframe loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${s.lng-0.004}%2C${s.lat-0.0025}%2C${s.lng+0.004}%2C${s.lat+0.0025}&layer=mapnik&marker=${s.lat}%2C${s.lng}"></iframe>
        <div class="maplinks">
          <a href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}" target="_blank" rel="noopener">Google Maps ↗</a>
          <a href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&travelmode=walking" target="_blank" rel="noopener">Navigation starten ↗</a>
        </div>
      </div>` : ''}
      ${s.anekdoteText ? `
      <div class="anekdote">
        <span class="anekdote-label">${s.anekdoteLabel}</span>
        <h3>${s.anekdoteTitle}</h3>
        <p>${s.anekdoteText}</p>
      </div>` : ''}
    </div>
  `;
  slidesEl.appendChild(el);

  const x = 20 + (i * (totalLen / (stations.length - 1)));
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','route-dot');
  g.setAttribute('data-i', i);
  g.innerHTML = `<circle class="pulse" cx="${x}" cy="17" r="7"></circle><circle class="base" cx="${x}" cy="17" r="5"></circle>`;
  g.addEventListener('click', () => { current = i; render(); });
  routeDots.appendChild(g);
});

function render(){
  document.querySelectorAll('.slide').forEach((el,i)=> el.classList.toggle('active', i===current));
  document.querySelectorAll('.route-dot').forEach((el,i)=>{
    el.classList.toggle('done', i < current);
    el.classList.toggle('current', i === current);
  });
  const x = 20 + (current * (totalLen / (stations.length - 1)));
  routeFill.setAttribute('d', `M20,17 L${x},17`);
  document.getElementById('counter').textContent = (current+1) + ' / ' + stations.length;
  document.getElementById('phaseIndicator').textContent = stations[current].eyebrow;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === stations.length - 1;
  document.querySelector('.body-scroll:not([style*="display: none"])');
  const active = document.querySelector('.slide.active .body-scroll');
  if(active) active.scrollTop = 0;
}
function go(dir){
  const next = current + dir;
  if(next < 0 || next > stations.length - 1) return;
  current = next;
  render();
}
document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
});
let touchX = null;
document.addEventListener('touchstart', e => touchX = e.touches[0].clientX);
document.addEventListener('touchend', e => {
  if(touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
  touchX = null;
});
render();
</script>
</body>
</html>
